<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB Studio - Agendamento</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fontes (Bebas Neue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'ui-sans-serif', system-ui, sans-serif;
    }
    .font-bebas {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 1px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #1e40af; }

    #bookingDate {
      color-scheme: dark;
      color: #ffffff;
    }

    #bookingTime option {
      background-color: #18181b;
      color: #ffffff;
    }

    #bookingTime option:disabled {
      color: #ef4444 !important;
      background-color: #27272a;
    }
  </style>
  <!-- Adicionar dentro do <head> do seu index.html -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col justify-between">

  <!-- Header / Topo -->
  <header class="bg-zinc-900 border-b border-zinc-800 py-3 px-6 text-center sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fas fa-scissors text-blue-600 text-xl transform -rotate-45"></i>
        <span class="font-bebas text-2xl tracking-wider text-white">FB <span class="text-blue-600">STUDIO</span></span>
      </div>
      <span class="bg-zinc-800 text-blue-400 border border-zinc-700 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider">
        <i class="fas fa-circle text-[8px] text-emerald-500 mr-1"></i> Aberto
      </span>
    </div>
  </header>

  <!-- Conteúdo Principal / Form de Agendamento -->
  <main class="max-w-md mx-auto w-full p-4 flex-1 space-y-5">

    <!-- LOGÓTIPO -->
    <div class="flex justify-center my-2">
      <img id="logoImg" src="logo" alt="FB Studio Logo" class="max-h-48 object-contain transition-transform hover:scale-105 duration-300">
    </div>

    <!-- Card de Boas-Vindas -->
    <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl shadow-md flex items-center space-x-4">
      <div class="bg-blue-950/80 p-3 rounded-xl border border-blue-900 text-blue-400">
        <i class="fas fa-cut text-2xl"></i>
      </div>
      <div>
        <h1 class="text-lg font-bebas tracking-wide text-white">Agende o seu horário</h1>
        <p class="text-xs text-zinc-400">Escolha os serviços e o melhor horário para você.</p>
      </div>
    </div>

    <!-- Formulário de Agendamento -->
    <form id="bookingForm" onsubmit="handleBooking(event)" class="space-y-4">

      <!-- 1. Dados do Cliente -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-3 shadow-md">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center">
          <span class="w-5 h-5 bg-blue-900 text-blue-200 rounded-full flex items-center justify-center text-[10px] mr-2">1</span>
          Seus Dados
        </h2>
        <div>
          <label class="block text-[11px] font-medium text-zinc-400 mb-1">Nome Completo *</label>
          <input type="text" id="clientName" required placeholder="Digite o seu nome"
            class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-700 transition-all">
        </div>
      </div>

      <!-- 2. Seleção de Serviços -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-3 shadow-md">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center">
            <span class="w-5 h-5 bg-blue-900 text-blue-200 rounded-full flex items-center justify-center text-[10px] mr-2">2</span>
            Escolha os Serviços
          </h2>
          <span class="text-[10px] text-zinc-500">(Pode marcar mais de um)</span>
        </div>

        <div class="space-y-2" id="servicesList">
          <label class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 cursor-pointer hover:border-blue-900 transition-all">
            <div class="flex items-center space-x-3">
              <input type="checkbox" name="service" value="Corte de Cabelo" data-price="30.00" onchange="calculateTotal()" class="accent-blue-700 w-4 h-4 rounded">
              <div>
                <p class="font-semibold text-xs text-white">Corte de Cabelo</p>
                <p class="text-[10px] text-zinc-400">Corte tradicional de cabelo</p>
              </div>
            </div>
            <span class="font-bold text-xs text-blue-300 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-blue-900/60">R$ 30,00</span>
          </label>

          <label class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 cursor-pointer hover:border-blue-900 transition-all">
            <div class="flex items-center space-x-3">
              <input type="checkbox" name="service" value="Corte Navalhado" data-price="35.00" onchange="calculateTotal()" class="accent-blue-700 w-4 h-4 rounded">
              <div>
                <p class="font-semibold text-xs text-white">Corte Navalhado</p>
                <p class="text-[10px] text-zinc-400">Corte degradê / acabamento na navalha</p>
              </div>
            </div>
            <span class="font-bold text-xs text-blue-300 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-blue-900/60">R$ 35,00</span>
          </label>

          <label class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 cursor-pointer hover:border-blue-900 transition-all">
            <div class="flex items-center space-x-3">
              <input type="checkbox" name="service" value="Sobrancelha" data-price="5.00" onchange="calculateTotal()" class="accent-blue-700 w-4 h-4 rounded">
              <div>
                <p class="font-semibold text-xs text-white">Sobrancelha</p>
                <p class="text-[10px] text-zinc-400">Design e alinhamento de sobrancelha</p>
              </div>
            </div>
            <span class="font-bold text-xs text-blue-300 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-blue-900/60">R$ 5,00</span>
          </label>

          <label class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 cursor-pointer hover:border-blue-900 transition-all">
            <div class="flex items-center space-x-3">
              <input type="checkbox" name="service" value="Barba" data-price="25.00" onchange="calculateTotal()" class="accent-blue-700 w-4 h-4 rounded">
              <div>
                <p class="font-semibold text-xs text-white">Barba</p>
                <p class="text-[10px] text-zinc-400">Modelagem e corte de barba</p>
              </div>
            </div>
            <span class="font-bold text-xs text-blue-300 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-blue-900/60">R$ 25,00</span>
          </label>

          <label class="flex items-center justify-between bg-zinc-950 p-3 rounded-xl border border-zinc-800/80 cursor-pointer hover:border-blue-900 transition-all">
            <div class="flex items-center space-x-3">
              <input type="checkbox" name="service" value="Corte + Barba" data-price="50.00" onchange="calculateTotal()" class="accent-blue-700 w-4 h-4 rounded">
              <div>
                <p class="font-semibold text-xs text-white">Corte + Barba</p>
                <p class="text-[10px] text-zinc-400">Combo completo de Cabelo e Barba</p>
              </div>
            </div>
            <span class="font-bold text-xs text-blue-300 bg-blue-950/80 px-2.5 py-1 rounded-lg border border-blue-900/60">R$ 50,00</span>
          </label>
        </div>

        <div class="pt-2 flex justify-between items-center border-t border-zinc-800 text-xs font-bold text-zinc-300">
          <span>Valor Total Estimado:</span>
          <span id="totalDisplay" class="text-blue-400 text-sm font-bebas tracking-wider">R$ 0,00</span>
        </div>
      </div>

      <!-- 3. Profissional -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-3 shadow-md">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center">
          <span class="w-5 h-5 bg-blue-900 text-blue-200 rounded-full flex items-center justify-center text-[10px] mr-2">3</span>
          Profissional
        </h2>
        <select id="barber" onchange="updateAvailableTimes()" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-700">
          <option value="Barbeiro Felipe" selected>Barbeiro Felipe</option>
        </select>
      </div>

      <!-- 4. Data e Horário -->
      <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl space-y-3 shadow-md">
        <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 flex items-center">
          <span class="w-5 h-5 bg-blue-900 text-blue-200 rounded-full flex items-center justify-center text-[10px] mr-2">4</span>
          Data e Horário
        </h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Data *</label>
            <input type="date" id="bookingDate" required onchange="updateAvailableTimes()"
              class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-700">
          </div>
          <div>
            <label class="block text-[11px] font-medium text-zinc-400 mb-1">Horário *</label>
            <select id="bookingTime" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-blue-700">
              <option value="">Escolha a data...</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Botão Enviar para WhatsApp -->
      <button type="submit" 
        class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bebas text-lg tracking-widest py-3.5 px-4 rounded-2xl uppercase shadow-md transition-all flex items-center justify-center space-x-2 active:scale-95 cursor-pointer border border-blue-700/50">
        <i class="fab fa-whatsapp text-xl text-emerald-400"></i>
        <span>Confirmar Agendamento</span>
      </button>

</form>

  </main>

  <!-- Rodapé -->
  <footer class="bg-zinc-900 border-t border-zinc-800 py-4 text-center text-zinc-500 text-[10px]">
    <p>© 2026 FB Studio Barber. Todos os direitos reservados.</p>
  </footer>

  <!-- Script da lógica integrada com Supabase e WhatsApp -->
  <script>
    const SUPABASE_URL = 'https://smpdgiyptxpwsgpzsvqn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kb6XJNh2Tv_lv9CMrb9ejw_3H66WzeG';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const WHATSAPP_NUMBER = '5565993529203';

    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('bookingDate');
      dateInput.min = today;
      dateInput.value = today;
      updateAvailableTimes();
      calculateTotal();
    });

    function calculateTotal() {
      const checkboxes = document.querySelectorAll('input[name="service"]:checked');
      let total = 0;
      checkboxes.forEach(cb => {
        total += parseFloat(cb.getAttribute('data-price'));
      });
      document.getElementById('totalDisplay').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    async function updateAvailableTimes() {
      const dateInput = document.getElementById('bookingDate').value;
      const barberInput = document.getElementById('barber').value;
      const timeSelect = document.getElementById('bookingTime');
      timeSelect.innerHTML = '';

      if (!dateInput) return;

      const selectedDate = new Date(dateInput + 'T12:00:00');
      const dayOfWeek = selectedDate.getDay();

      if (dayOfWeek === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = 'Fechado aos Domingos';
        timeSelect.appendChild(option);
        return;
      }

      let times = (dayOfWeek === 6)
        ? ["09:00", "10:00", "11:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"]
        : ["13:00", "14:00", "15:00", "16:00", "17:00", "18:00", "19:00"];

      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = 'Selecione o horário...';
      timeSelect.appendChild(defaultOption);

      try {
        const { data: occupiedSlots, error } = await supabase
          .from('agendamentos')
          .select('horario, barbeiro')
          .eq('data', dateInput);

        times.forEach(time => {
          const option = document.createElement('option');
          const isBooked = Array.isArray(occupiedSlots) && occupiedSlots.some(b => 
            b.horario === time && (b.barbeiro === barberInput || b.barbeiro === "Qualquer Barbeiro")
          );

          if (isBooked) {
            option.value = '';
            option.textContent = `${time}h (Indisponível)`;
            option.disabled = true;
          } else {
            option.value = time;
            option.textContent = `${time}h`;
          }
          timeSelect.appendChild(option);
        });
      } catch (err) {
        times.forEach(time => {
          const option = document.createElement('option');
          option.value = time;
          option.textContent = `${time}h`;
          timeSelect.appendChild(option);
        });
      }
    }

    function redirectToWhatsApp(name, barber, date, time, total, selectedServices) {
      const [year, month, day] = date.split('-');
      const formattedDate = `${day}/${month}/${year}`;
      const servicesText = selectedServices
        .map(s => `• ${s.nome} (R$ ${s.preco.toFixed(2).replace('.', ',')})`)
        .join('\n');

      const rawMessage = 
`*NOVO AGENDAMENTO - FB STUDIO*

*Cliente:* ${name}
*Barbeiro:* ${barber}
*Data:* ${formattedDate}
*Horário:* ${time}h

*Serviços:*
${servicesText}

*Valor Total:* R$ ${total.toFixed(2).replace('.', ',')}`;

      const encodedMessage = encodeURIComponent(rawMessage);
      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
    }

    async function handleBooking(event) {
      event.preventDefault();

      const name = document.getElementById('clientName').value.trim();
      const barber = document.getElementById('barber').value;
      const date = document.getElementById('bookingDate').value;
      const time = document.getElementById('bookingTime').value;

      const selectedServices = [];
      let total = 0;

      document.querySelectorAll('input[name="service"]:checked').forEach(cb => {
        const price = parseFloat(cb.getAttribute('data-price'));
        selectedServices.push({ nome: cb.value, preco: price });
        total += price;
      });

      if (selectedServices.length === 0) {
        alert('Por favor, selecione pelo menos um serviço.');
        return;
      }

      if (!time) {
        alert('Por favor, selecione um horário disponível.');
        return;
      }

      try {
        await supabase
          .from('agendamentos')
          .insert([
            {
              cliente_nome: name,
              barbeiro: barber,
              data: date,
              horario: time,
              valor_total: total,
              servicos: selectedServices
            }
          ]);
      } catch (err) {
        console.warn('Falha na gravação:', err);
      }

      redirectToWhatsApp(name, barber, date, time, total, selectedServices);
    }
  </script>
</body>
</html>
